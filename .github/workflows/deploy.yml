name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second deploy starting mid-upload would interleave two file sets on the
# server. Queue them instead, and never cancel one that is already writing.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Fails the run before touching the server if the export came out wrong.
      - name: Verify build output
        run: |
          test -f out/index.html || { echo "missing out/index.html"; exit 1; }
          test -f out/404.html   || { echo "missing out/404.html"; exit 1; }
          test -f out/.htaccess  || { echo "missing out/.htaccess"; exit 1; }

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: public_html/
          # Default excludes drop all dotfiles, which would silently strip
          # .htaccess and leave the 404 and cache headers dead on the server.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**